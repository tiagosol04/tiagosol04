<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Tiago Sol Ribeiro, Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="42%" stop-color="#4c1d95"/>
      <stop offset="74%" stop-color="#0466c8"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .up { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.3,1) both; }
    .d1 { animation-delay: .10s } .d2 { animation-delay: .25s }
    .d3 { animation-delay: .40s } .d4 { animation-delay: .55s }
    @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
    .cursor { animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 50% { opacity: 0 } }
    .orb { animation: drift 14s ease-in-out infinite }
    .orb2 { animation: drift 18s ease-in-out infinite reverse }
    @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(26px,-18px) } }
    .sweep { animation: sweep 6s linear infinite }
    @keyframes sweep { 0% { transform: translateX(-420px) } 100% { transform: translateX(1000px) } }
    .dot { animation: pulse 2.4s ease-in-out infinite }
    .dot2 { animation: pulse 2.4s ease-in-out .8s infinite }
    .dot3 { animation: pulse 2.4s ease-in-out 1.6s infinite }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  </style>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <g opacity="0.30">
    <circle class="orb" cx="140" cy="70" r="90" fill="#00e5ff" opacity="0.20"/>
    <circle class="orb2" cx="880" cy="215" r="110" fill="#7c3aed" opacity="0.25"/>
    <circle class="orb2" cx="700" cy="40" r="60" fill="#00b4d8" opacity="0.18"/>
  </g>

  <g class="up d1" opacity="0.9">
    <text class="t" x="46" y="52" font-size="15" fill="#00e5ff" opacity="0.85">&lt;/&gt;</text>
    <text class="t" x="900" y="52" font-size="15" fill="#00e5ff" opacity="0.85">{ }</text>
  </g>

  <text class="t up d2" x="500" y="120" text-anchor="middle" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="4">TIAGO SOL RIBEIRO</text>

  <g class="up d3">
    <rect x="250" y="140" width="500" height="2" fill="url(#line)"/>
  </g>

  <text class="t up d3" x="500" y="176" text-anchor="middle" font-size="17" fill="#dbeafe" letter-spacing="2">SOFTWARE DEVELOPER · MSc STUDENT @ UTAD</text>

  <g class="up d4">
    <rect x="248" y="200" width="504" height="44" rx="10" fill="#0b1220" fill-opacity="0.55" stroke="#00e5ff" stroke-opacity="0.35"/>
    <circle class="dot" cx="272" cy="222" r="4.5" fill="#ff5f57"/>
    <circle class="dot2" cx="288" cy="222" r="4.5" fill="#febc2e"/>
    <circle class="dot3" cx="304" cy="222" r="4.5" fill="#28c840"/>
    <text class="t" x="324" y="228" font-size="14" fill="#cbd5e1">
      <tspan fill="#00e5ff">~$</tspan> android · backend · cybersecurity · ai<tspan class="cursor" fill="#00e5ff" dx="6">▌</tspan>
    </text>
  </g>

  <g clip-path="inset(0 0 0 0)">
    <rect class="sweep" x="0" y="0" width="420" height="280" fill="#ffffff" opacity="0.035"/>
  </g>
</svg>
