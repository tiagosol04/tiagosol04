<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="38%" stop-color="#0466c8"/>
      <stop offset="72%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
  </defs>

  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .w1 { animation: slide 16s linear infinite }
    .w2 { animation: slide 24s linear infinite reverse }
    @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-500px) } }
    .cur { animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 50% { opacity: 0 } }
  </style>

  <rect y="30" width="1000" height="120" fill="url(#fbg)"/>

  <g class="w2" opacity="0.35">
    <path d="M0 44 q125 -26 250 0 t250 0 t250 0 t250 0 t250 0 V150 H0 Z" fill="#0466c8"/>
  </g>
  <g class="w1" opacity="0.55">
    <path d="M0 56 q125 26 250 0 t250 0 t250 0 t250 0 t250 0 V150 H0 Z" fill="#0d1b2a" opacity="0.45"/>
  </g>

  <text class="t" x="500" y="108" text-anchor="middle" font-size="17" fill="#ffffff" letter-spacing="2">
    thanks for scrolling<tspan class="cur" fill="#00e5ff" dx="8">▌</tspan>
  </text>
</svg>
